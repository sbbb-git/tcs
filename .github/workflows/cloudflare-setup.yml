name: Configuration Cloudflare

# Utilitaire d'administration, déclenché à la main. Il inspecte le compte
# Cloudflare et rattache le domaine au projet Pages. La session Claude n'a pas
# accès à l'API Cloudflare ; la CI dispose du token.
on:
  workflow_dispatch:
    inputs:
      attach_domain:
        description: "Rattacher le domaine au projet Pages"
        type: boolean
        default: false
      create_dns:
        description: "Créer l'enregistrement DNS de l'apex vers le projet"
        type: boolean
        default: false
      fix_zone_settings:
        description: "Désactiver l'obfuscation d'e-mail sur la zone"
        type: boolean
        default: false
      setup_www:
        description: "Rediriger www vers l'apex en 301"
        type: boolean
        default: false
      ai_bots:
        description: "Robots IA : sonder puis ouvrir aux robots qui citent"
        type: boolean
        default: false
      www_via_pagerule:
        description: "www vers l'apex par Page Rule (permission distincte)"
        type: boolean
        default: false
      detach_www:
        description: "Détacher www du projet Pages et retirer son DNS"
        type: boolean
        default: false
      diagnose_token:
        description: "Diagnostiquer le token : identité et droits réels"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PROJECT_NAME: talentcaresante
  DOMAIN: talentcaresante.fr

jobs:
  setup:
    name: Inspecter et configurer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lister les déploiements récents
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments?per_page=10" \
            -o deployments.json || true

          python3 - <<'PY'
          import json

          data = json.load(open("deployments.json"))
          if not data.get("success"):
              print("Historique illisible :")
              for e in data.get("errors", []):
                  print(f"  [{e.get('code')}] {e.get('message')}")
              raise SystemExit(0)

          for d in data.get("result", [])[:10]:
              stage = (d.get("latest_stage") or {})
              trigger = (d.get("deployment_trigger") or {}).get("type", "?")
              print(f"  {d.get('created_on','')[:19]}  {d.get('environment','?'):<10}"
                    f"  {stage.get('name','?'):<8} {stage.get('status','?'):<9} {trigger}")
              if stage.get("status") == "failure":
                  print(f"     -> URL : {d.get('url')}")
          PY

      - name: Lister les projets Pages
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Ni le token ni l'identifiant de compte ne sont affichés.
          curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" \
            -o projects.json || true

          python3 - <<'PY'
          import json
          data = json.load(open("projects.json"))
          if not data.get("success"):
              print("L'API a refusé la requête :")
              for err in data.get("errors", []):
                  print(f"  [{err.get('code')}] {err.get('message')}")
              raise SystemExit(1)
          for p in data.get("result", []):
              print(f"  {p['name']:<20} {p.get('subdomain')}")
              print(f"  {'':<20} domaines : {', '.join(p.get('domains') or []) or '(aucun)'}")
          PY

      - name: Rattacher le domaine
        if: ${{ inputs.attach_domain }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ env.DOMAIN }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$DOMAIN\"}" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains" \
            -o attach.json || true

          python3 - <<'PY'
          import json, os
          domain = os.environ["DOMAIN"]
          data = json.load(open("attach.json"))
          if data.get("success"):
              res = data.get("result") or {}
              print(f"Domaine {domain} rattaché.")
              print(f"  statut       : {res.get('status')}")
              print(f"  vérification : {(res.get('validation_data') or {}).get('status')}")
              print("\nSi le statut reste en attente, l'enregistrement DNS manque :")
              print(f"  CNAME  {domain}  ->  {os.environ['PROJECT_NAME']}.pages.dev  (proxy activé)")
          else:
              print(f"Le rattachement de {domain} a échoué :")
              for err in data.get("errors", []):
                  code, msg = err.get("code"), err.get("message")
                  print(f"  [{code}] {msg}")
                  if code == 9109 or "authentication" in str(msg).lower():
                      print("  -> le token n'a probablement que la permission Pages:Edit.")
              print("\nÀ faire à la main dans le tableau de bord :")
              print(f"  Workers & Pages > {os.environ['PROJECT_NAME']} > Custom domains > Set up a custom domain")
              raise SystemExit(1)
          PY

      # Rattacher le domaine ne crée pas l'enregistrement DNS : l'assistant du
      # tableau de bord fait les deux, l'API seulement le premier. Sans
      # enregistrement, le domaine reste en « initializing » indéfiniment.
      - name: Créer l'enregistrement DNS
        if: ${{ inputs.create_dns }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN: ${{ env.DOMAIN }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" \
            -o zone.json || true

          python3 - <<'PY'
          import json, os, subprocess, sys

          domain = os.environ["DOMAIN"]
          project = os.environ["PROJECT_NAME"]
          token = os.environ["CF_API_TOKEN"]

          def dashboard_fallback():
              print("\nÀ faire à la main dans le tableau de bord Cloudflare :")
              print(f"  Workers & Pages > {project} > Custom domains")
              print(f"  ou : DNS > Records > Add record")
              print(f"       Type CNAME | Name @ | Target {project}.pages.dev | Proxy activé")

          zone = json.load(open("zone.json"))
          if not zone.get("success") or not zone.get("result"):
              print(f"Impossible de lire la zone {domain} :")
              for err in zone.get("errors", []):
                  print(f"  [{err.get('code')}] {err.get('message')}")
              print("  -> le token ne porte pas la permission Zone:Read.")
              dashboard_fallback()
              sys.exit(1)

          zone_id = zone["result"][0]["id"]
          payload = json.dumps({
              "type": "CNAME",
              "name": domain,
              "content": f"{project}.pages.dev",
              "proxied": True,
              "comment": "Cloudflare Pages — site TalentCare Santé",
          })

          out = subprocess.run([
              "curl", "-sS", "-X", "POST",
              "-H", f"Authorization: Bearer {token}",
              "-H", "Content-Type: application/json",
              "-d", payload,
              f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records",
          ], capture_output=True, text=True).stdout

          res = json.loads(out)
          if res.get("success"):
              r = res["result"]
              print(f"Enregistrement créé : {r['type']} {r['name']} -> {r['content']} (proxy: {r['proxied']})")
          else:
              already = any(e.get("code") == 81053 for e in res.get("errors", []))
              if already:
                  print("L'enregistrement existe déjà.")
              else:
                  print("Création refusée :")
                  for err in res.get("errors", []):
                      print(f"  [{err.get('code')}] {err.get('message')}")
                  print("  -> le token ne porte probablement pas la permission DNS:Edit.")
                  dashboard_fallback()
                  sys.exit(1)
          PY

      # L'obfuscation d'e-mail de Cloudflare réécrit les liens mailto: en une
      # URL /cdn-cgi/l/email-protection qui renvoie 404 aux robots — sur chaque
      # page portant une adresse. Elle est active par défaut.
      - name: Désactiver l'obfuscation d'e-mail
        if: ${{ inputs.fix_zone_settings }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN: ${{ env.DOMAIN }}
        run: |
          curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" \
            -o zone.json || true

          python3 - <<'PY'
          import json, os, subprocess, sys

          domain = os.environ["DOMAIN"]
          token = os.environ["CF_API_TOKEN"]

          zone = json.load(open("zone.json"))
          if not zone.get("success") or not zone.get("result"):
              print(f"Zone {domain} illisible — le token ne porte pas Zone:Read.")
              sys.exit(1)
          zone_id = zone["result"][0]["id"]

          out = subprocess.run([
              "curl", "-sS", "-X", "PATCH",
              "-H", f"Authorization: Bearer {token}",
              "-H", "Content-Type: application/json",
              "-d", json.dumps({"value": "off"}),
              f"https://api.cloudflare.com/client/v4/zones/{zone_id}/settings/email_obfuscation",
          ], capture_output=True, text=True).stdout

          res = json.loads(out)
          if res.get("success"):
              print(f"Obfuscation d'e-mail : {res['result']['value']}")
          else:
              print("Modification refusée :")
              for err in res.get("errors", []):
                  print(f"  [{err.get('code')}] {err.get('message')}")
              print("  -> le token ne porte pas la permission Zone Settings:Edit.")
              print("\nÀ faire à la main : Cloudflare > le domaine > Scrape Shield")
              print("  > Email Address Obfuscation > désactiver")
              sys.exit(1)
          PY

      # www n'existe pas : la règle de redirection est donc posée AVANT
      # l'enregistrement DNS. Dans l'ordre inverse, un échec de la règle
      # laisserait www servir le même site que l'apex, deux hostnames pour un
      # même contenu, exactement ce qu'on cherche à éviter.
      #
      # Le jeu de règles est lu puis réécrit augmenté de la nôtre, jamais
      # remplacé : l'API de cette phase n'accepte que des PUT sur l'ensemble du
      # ruleset, et un PUT nu effacerait les redirections déjà en place.
      - name: Rediriger www vers l'apex
        if: ${{ inputs.setup_www }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN: ${{ env.DOMAIN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, time

          domain = os.environ["DOMAIN"]
          www = f"www.{domain}"
          token = os.environ["CF_API_TOKEN"]
          api = "https://api.cloudflare.com/client/v4"

          def call(method, path, body=None):
              cmd = ["curl", "-sS", "-X", method,
                     "-H", f"Authorization: Bearer {token}",
                     "-H", "Content-Type: application/json"]
              if body is not None:
                  cmd += ["-d", json.dumps(body)]
              cmd.append(f"{api}{path}")
              out = subprocess.run(cmd, capture_output=True, text=True).stdout
              try:
                  return json.loads(out)
              except json.JSONDecodeError:
                  return {"success": False, "errors": [{"code": 0, "message": out[:300]}]}

          def errs(res):
              return ", ".join(f"[{e.get('code')}] {e.get('message')}"
                               for e in res.get("errors", []))

          zone = call("GET", f"/zones?name={domain}")
          if not zone.get("success") or not zone.get("result"):
              print(f"Zone {domain} illisible : {errs(zone)}")
              sys.exit(1)
          zone_id = zone["result"][0]["id"]

          phase = "/rulesets/phases/http_request_dynamic_redirect/entrypoint"
          notre_regle = {
              "action": "redirect",
              "description": f"{www} vers l'apex",
              "expression": f'(http.host eq "{www}")',
              "action_parameters": {
                  "from_value": {
                      "status_code": 301,
                      "target_url": {
                          "expression": f'concat("https://{domain}", http.request.uri.path)'
                      },
                      "preserve_query_string": True,
                  }
              },
          }

          # 1) Lire l'existant pour ne rien écraser.
          actuel = call("GET", f"/zones/{zone_id}{phase}")
          existantes = []
          if actuel.get("success"):
              existantes = actuel.get("result", {}).get("rules", []) or []
              print(f"{len(existantes)} règle(s) de redirection déjà en place, conservée(s).")
          elif any(e.get("code") == 10000 for e in actuel.get("errors", [])):
              print(f"Lecture des règles refusée : {errs(actuel)}")
              print("  -> permission Dynamic Redirect absente du token.")
              sys.exit(1)
          else:
              print("Aucun jeu de règles existant.")

          deja = [r for r in existantes
                  if r.get("expression") == notre_regle["expression"]]
          if deja:
              print("La règle www existait déjà, elle est remplacée par la même.")
              existantes = [r for r in existantes if r not in deja]

          garde = [{k: r[k] for k in ("action", "expression", "description",
                                      "action_parameters", "enabled")
                    if k in r} for r in existantes]

          res = call("PUT", f"/zones/{zone_id}{phase}", {"rules": garde + [notre_regle]})
          if not res.get("success"):
              print(f"Création de la règle refusée : {errs(res)}")
              print("  -> permission Dynamic Redirect:Edit absente du token.")
              print("\nÀ faire à la main : Cloudflare > le domaine > Rules > Redirect Rules")
              print(f"  Si http.host = {www}  ->  301 vers https://{domain} (préserver le chemin)")
              sys.exit(1)
          print("Règle de redirection 301 posée.")

          # 2) L'enregistrement DNS, seulement une fois la règle en place.
          dns = call("POST", f"/zones/{zone_id}/dns_records", {
              "type": "CNAME", "name": www, "content": domain,
              "proxied": True, "comment": "Redirigé en 301 vers l'apex",
          })
          record_id = None
          if dns.get("success"):
              record_id = dns["result"]["id"]
              print(f"{www} créé : CNAME -> {domain} (proxy activé)")
          elif any(e.get("code") == 81053 for e in dns.get("errors", [])):
              print(f"{www} existait déjà.")
          else:
              print(f"Création DNS refusée : {errs(dns)}")
              sys.exit(1)

          # 3) Vérifier le comportement réel, pas seulement le succès de l'API.
          print("\nPropagation, puis vérification...")
          for essai in range(12):
              time.sleep(15)
              out = subprocess.run(
                  ["curl", "-sS", "-o", "/dev/null", "-w", "%{http_code} %{redirect_url}",
                   "--max-time", "10", f"https://{www}/offres-emploi/?a=1"],
                  capture_output=True, text=True).stdout.split(" ", 1)
              statut = out[0]
              cible = out[1].strip() if len(out) > 1 else ""
              print(f"  essai {essai + 1} : {statut} {cible}")
              if statut == "301" and cible.startswith(f"https://{domain}/offres-emploi/"):
                  print(f"\nOK : {www} redirige en 301 vers l'apex, chemin et requête préservés.")
                  sys.exit(0)

          print("\nLa redirection ne se déclenche pas. Retour en arrière :")
          if record_id:
              rm = call("DELETE", f"/zones/{zone_id}/dns_records/{record_id}")
              print("  DNS retiré." if rm.get("success") else f"  DNS : {errs(rm)}")
              print("  www redevient injoignable, ce qui vaut mieux qu'un doublon indexable.")
          sys.exit(1)
          PY

      # Le blocage des robots IA vient du robots.txt managé de Cloudflare, pas
      # du site : src/app/robots.ts autorise déjà les robots de recherche IA,
      # mais Cloudflare injecte ses propres Disallow au-dessus. On sonde
      # d'abord ce que le token voit, puis on tente le réglage.
      - name: Robots IA
        if: ${{ inputs.ai_bots }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ env.DOMAIN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          domain = os.environ["DOMAIN"]
          account = os.environ["CF_ACCOUNT_ID"]
          token = os.environ["CF_API_TOKEN"]
          api = "https://api.cloudflare.com/client/v4"

          def call(method, path, body=None):
              cmd = ["curl", "-sS", "-X", method,
                     "-H", f"Authorization: Bearer {token}",
                     "-H", "Content-Type: application/json"]
              if body is not None:
                  cmd += ["-d", json.dumps(body)]
              cmd.append(f"{api}{path}")
              out = subprocess.run(cmd, capture_output=True, text=True).stdout
              try:
                  return json.loads(out)
              except json.JSONDecodeError:
                  return {"success": False, "errors": [{"code": 0, "message": out[:300]}]}

          def show(label, res):
              if res.get("success"):
                  print(f"  OK   {label}")
                  return True
              codes = ", ".join(f"[{e.get('code')}] {e.get('message')}" for e in res.get("errors", []))
              print(f"  NON  {label} :: {codes}")
              return False

          zone = call("GET", f"/zones?name={domain}")
          if not zone.get("success") or not zone.get("result"):
              print("Zone illisible."); raise SystemExit(1)
          zone_id = zone["result"][0]["id"]
          print(f"Zone : {zone_id}\n")

          print("Sondage des points d'entrée :")
          probes = [
              ("réglages de zone", "GET", f"/zones/{zone_id}/settings"),
              ("AI Crawl Control tirets (zone)", "GET", f"/zones/{zone_id}/ai-crawl-control/robots_txt"),
              ("AI Crawl Control tirets (compte)", "GET", f"/accounts/{account}/ai-crawl-control/robots_txt"),
              ("ai_crawl_control (zone)", "GET", f"/zones/{zone_id}/ai_crawl_control/robots_txt"),
              ("ai_crawl_control (compte)", "GET", f"/accounts/{account}/ai_crawl_control/robots_txt"),
              ("ai_crawl_control racine (zone)", "GET", f"/zones/{zone_id}/ai_crawl_control"),
              ("content signals (zone)", "GET", f"/zones/{zone_id}/content_signals"),
              ("managed_robots_txt (zone)", "GET", f"/zones/{zone_id}/managed_robots_txt"),
              ("réglage managed_robots_txt", "GET", f"/zones/{zone_id}/settings/managed_robots_txt"),
              ("bot_management (zone)", "GET", f"/zones/{zone_id}/bot_management"),
              ("managed_headers (zone)", "GET", f"/zones/{zone_id}/managed_headers"),
          ]
          reachable = {}
          for label, method, path in probes:
              res = call(method, path)
              if show(label, res):
                  reachable[label] = res

          settings = reachable.get("réglages de zone")
          if settings:
              ids = sorted(s.get("id", "") for s in settings.get("result", []))
              print(f"\n{len(ids)} réglages de zone lisibles :")
              print("  " + ", ".join(ids))

          print("\nTentative de désactivation du robots.txt managé :")
          for path in (f"/zones/{zone_id}/settings/managed_robots_txt",
                       f"/accounts/{account}/ai-crawl-control/robots_txt"):
              show(path, call("PATCH", path, {"value": "off", "enabled": False}))
          PY

      # Les Page Rules sont l'ancien mécanisme de redirection de Cloudflare et
      # relèvent d'une permission distincte de Dynamic Redirect. Le token peut
      # donc avoir l'une sans l'autre : c'est la dernière voie automatisable
      # avant de passer la main.
      #
      # Même garde-fou que précédemment : si la redirection ne se déclenche
      # pas, l'étape retire ce qu'elle a créé plutôt que de laisser www servir
      # le même contenu que l'apex.
      - name: www vers l'apex par Page Rule
        if: ${{ inputs.www_via_pagerule }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN: ${{ env.DOMAIN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time

          domain = os.environ["DOMAIN"]
          www = f"www.{domain}"
          token = os.environ["CF_API_TOKEN"]
          api = "https://api.cloudflare.com/client/v4"

          def call(method, path, body=None):
              cmd = ["curl", "-sS", "-X", method,
                     "-H", f"Authorization: Bearer {token}",
                     "-H", "Content-Type: application/json"]
              if body is not None:
                  cmd += ["-d", json.dumps(body)]
              cmd.append(f"{api}{path}")
              out = subprocess.run(cmd, capture_output=True, text=True).stdout
              try:
                  return json.loads(out)
              except json.JSONDecodeError:
                  return {"success": False, "errors": [{"code": 0, "message": out[:300]}]}

          def errs(res):
              return ", ".join(f"[{e.get('code')}] {e.get('message')}" for e in res.get("errors", []))

          zone_id = call("GET", f"/zones?name={domain}")["result"][0]["id"]

          # 1) La Page Rule, avant tout enregistrement DNS.
          rule = call("POST", f"/zones/{zone_id}/pagerules", {
              "targets": [{"target": "url", "constraint": {
                  "operator": "matches", "value": f"{www}/*"}}],
              "actions": [{"id": "forwarding_url", "value": {
                  "url": f"https://{domain}/$1", "status_code": 301}}],
              "status": "active",
              "priority": 1,
          })
          if not rule.get("success"):
              print(f"Page Rule refusée : {errs(rule)}")
              print("  -> le token n'a pas non plus la permission Page Rules:Edit.")
              raise SystemExit(1)
          rule_id = rule["result"]["id"]
          print(f"Page Rule créée : {www}/* -> https://{domain}/$1 en 301")

          # 2) L'enregistrement DNS, seulement ensuite.
          dns = call("POST", f"/zones/{zone_id}/dns_records", {
              "type": "CNAME", "name": www, "content": domain,
              "proxied": True, "comment": "Redirigé en 301 vers l'apex par Page Rule",
          })
          record_id = dns["result"]["id"] if dns.get("success") else None
          if record_id:
              print(f"{www} créé : CNAME -> {domain}")
          elif any(e.get("code") == 81053 for e in dns.get("errors", [])):
              print(f"{www} existait déjà.")
          else:
              print(f"Création DNS refusée : {errs(dns)}")
              call("DELETE", f"/zones/{zone_id}/pagerules/{rule_id}")
              raise SystemExit(1)

          # 3) Vérification réelle.
          print("\nPropagation, puis vérification...")
          for essai in range(12):
              time.sleep(15)
              out = subprocess.run(
                  ["curl", "-sS", "-o", "/dev/null", "-w", "%{http_code} %{redirect_url}",
                   "--max-time", "10", f"https://{www}/offres-emploi/"],
                  capture_output=True, text=True).stdout.split(" ", 1)
              statut = out[0]
              location = out[1].strip() if len(out) > 1 else ""
              print(f"  essai {essai + 1} : {statut} {location}")
              if statut in ("301", "302") and location.startswith(f"https://{domain}/"):
                  print(f"\nOK : {www} redirige en {statut} vers l'apex, chemin préservé.")
                  raise SystemExit(0)

          print("\nLa redirection ne se déclenche pas. Retour en arrière :")
          if record_id:
              rm = call("DELETE", f"/zones/{zone_id}/dns_records/{record_id}")
              print("  DNS retiré." if rm.get("success") else f"  DNS : {errs(rm)}")
          rm = call("DELETE", f"/zones/{zone_id}/pagerules/{rule_id}")
          print("  Page Rule retirée." if rm.get("success") else f"  Page Rule : {errs(rm)}")
          raise SystemExit(1)
          PY

      # Remet www dans son état d'origine : ni rattaché au projet Pages, ni
      # résolu. Un www rattaché mais sans DNS est un piège : le jour où
      # quelqu'un ajoute l'enregistrement sans poser la redirection, le site
      # est servi en double sous deux noms d'hôte.
      - name: Détacher www
        if: ${{ inputs.detach_www }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ env.DOMAIN }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          domain = os.environ["DOMAIN"]
          www = f"www.{domain}"
          account = os.environ["CF_ACCOUNT_ID"]
          project = os.environ["PROJECT_NAME"]
          token = os.environ["CF_API_TOKEN"]
          api = "https://api.cloudflare.com/client/v4"

          def call(method, path):
              out = subprocess.run(
                  ["curl", "-sS", "-X", method,
                   "-H", f"Authorization: Bearer {token}",
                   "-H", "Content-Type: application/json", f"{api}{path}"],
                  capture_output=True, text=True).stdout
              try:
                  return json.loads(out)
              except json.JSONDecodeError:
                  return {"success": False, "errors": [{"code": 0, "message": out[:200]}]}

          zone_id = call("GET", f"/zones?name={domain}")["result"][0]["id"]

          recs = call("GET", f"/zones/{zone_id}/dns_records?name={www}")
          for rec in recs.get("result", []):
              res = call("DELETE", f"/zones/{zone_id}/dns_records/{rec['id']}")
              print(f"DNS {www} retiré." if res.get("success") else "DNS non retiré.")
          else:
              if not recs.get("result"):
                  print(f"Aucun enregistrement DNS {www}.")

          res = call("DELETE", f"/accounts/{account}/pages/projects/{project}/domains/{www}")
          print(f"{www} détaché du projet Pages." if res.get("success")
                else f"Détachement : {json.dumps(res.get('errors'))}")
          PY

      # Quand une écriture est refusée, deux causes se ressemblent : le secret
      # GitHub n'a pas été mis à jour, ou la permission manque encore. Cette
      # étape les distingue en identifiant le token puis en testant chaque
      # droit dont le projet a besoin.
      - name: Diagnostic du token
        if: ${{ inputs.diagnose_token }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ env.DOMAIN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess

          domain = os.environ["DOMAIN"]
          account = os.environ["CF_ACCOUNT_ID"]
          token = os.environ["CF_API_TOKEN"]
          api = "https://api.cloudflare.com/client/v4"

          def call(method, path, body=None):
              cmd = ["curl", "-sS", "-X", method,
                     "-H", f"Authorization: Bearer {token}",
                     "-H", "Content-Type: application/json"]
              if body is not None:
                  cmd += ["-d", json.dumps(body)]
              cmd.append(f"{api}{path}")
              out = subprocess.run(cmd, capture_output=True, text=True).stdout
              try:
                  return json.loads(out)
              except json.JSONDecodeError:
                  return {"success": False, "errors": [{"code": 0, "message": out[:200]}]}

          # Empreinte du secret : ne révèle pas le token, mais change si le
          # secret change. C'est le seul moyen de savoir d'un run à l'autre si
          # la valeur stockée dans GitHub a bougé.
          print(f"Empreinte du secret : {hashlib.sha256(token.encode()).hexdigest()[:12]}")
          print(f"Longueur : {len(token)} caractères\n")

          verif = call("GET", "/user/tokens/verify")
          if verif.get("success"):
              r = verif.get("result", {})
              print(f"Token valide, identifiant {r.get('id', '?')}, statut {r.get('status', '?')}\n")
          else:
              print("Token invalide ou illisible :")
              for e in verif.get("errors", []):
                  print(f"  [{e.get('code')}] {e.get('message')}")
              print()

          zone = call("GET", f"/zones?name={domain}")
          zone_id = zone["result"][0]["id"] if zone.get("success") and zone.get("result") else None

          tests = [
              ("Zone: Read", "GET", f"/zones?name={domain}"),
              ("DNS: Read", "GET", f"/zones/{zone_id}/dns_records?per_page=1"),
              ("Zone Settings: Read", "GET", f"/zones/{zone_id}/settings"),
              ("Cache Purge", "POST", f"/zones/{zone_id}/purge_cache"),
              ("Pages: Read", "GET", f"/accounts/{account}/pages/projects?per_page=1"),
              ("Dynamic Redirect: Read", "GET",
               f"/zones/{zone_id}/rulesets/phases/http_request_dynamic_redirect/entrypoint"),
              ("Page Rules: Read", "GET", f"/zones/{zone_id}/pagerules"),
              ("Bot Management: Read", "GET", f"/zones/{zone_id}/bot_management"),
              ("Rulesets: Read (tous)", "GET", f"/zones/{zone_id}/rulesets"),
          ]

          print("Droits réellement exerçables :")
          for label, method, path in tests:
              if zone_id is None and "/zones/None" in path:
                  print(f"  ?    {label} (zone inconnue)")
                  continue
              res = call(method, path, {} if method == "POST" else None)
              if res.get("success"):
                  print(f"  OUI  {label}")
              else:
                  codes = [e.get("code") for e in res.get("errors", [])]
                  msg = "; ".join(f"[{e.get('code')}] {e.get('message')}"
                                  for e in res.get("errors", []))
                  verdict = "NON " if 10000 in codes or 9109 in codes else "?   "
                  print(f"  {verdict} {label} :: {msg}")

          print("\nSi 'Dynamic Redirect: Read' est refusé alors que l'empreinte")
          print("du secret a changé, la permission n'a pas été ajoutée au token.")
          print("Si l'empreinte est identique au run précédent, c'est le secret")
          print("GitHub qui n'a pas été mis à jour.")
          PY
