name: Déploiement

# Le build part toujours du dépôt cloné par la CI, jamais d'un dossier local :
# c'est ce qui rend structurellement impossible qu'une page existe en
# production sans être versionnée.
on:
  push:
    branches: [main]
  # Reconstruction quotidienne : c'est elle qui fait sortir les articles datés
  # dans le futur, le jour venu, sans intervention.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# Un seul déploiement à la fois : deux builds concurrents publieraient dans un
# ordre imprévisible.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nom du projet Cloudflare Pages. Créé au premier déploiement s'il n'existe pas.
  PROJECT_NAME: talentcaresante

jobs:
  deploy:
    name: Construire et publier
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Toujours main, quel que soit le déclencheur.
      #
      # GitHub exécute les tâches planifiées depuis la branche PAR DÉFAUT du
      # dépôt, qui n'est pas forcément main. Sans ce ref explicite, la
      # reconstruction quotidienne publierait le contenu de la branche par
      # défaut — et un article corrigé sur main ne sortirait jamais.
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Vérifier la configuration
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=""
          [ -n "$ACCOUNT_ID" ] || missing="$missing\n  - secret CLOUDFLARE_ACCOUNT_ID"
          [ -n "$API_TOKEN" ]  || missing="$missing\n  - secret CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            printf 'Configuration incomplète :%b\n' "$missing"
            exit 1
          fi

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      # Bloquant : un lien interne mort, un title manquant ou un composant non
      # rendu arrête le déploiement au lieu d'atteindre les visiteurs.
      - name: Contrôles SEO
        run: npm run seo:check

      # `pages deploy` échoue si le projet n'existe pas ; on le crée au premier
      # passage. La commande est jouée après le build pour ne rien créer si la
      # construction échoue, et son échec est ignoré lorsque le projet est déjà là.
      - name: Créer le projet Pages si nécessaire
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages project create ${{ env.PROJECT_NAME }}
            --production-branch=main

      - name: Publier sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=${{ env.PROJECT_NAME }}
            --branch=main
            --commit-dirty=true

      # Sans purge, le CDN continue de servir l'ancienne version des fichiers
      # à durée de vie longue (robots.txt, sitemap.xml) après un déploiement.
      # Échec toléré : le token peut ne pas porter la permission de purge.
      - name: Purger le cache du CDN
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN: talentcaresante.fr
        run: |
          zone_id=$(curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('result') or [{}]; print(r[0].get('id',''))")

          if [ -z "$zone_id" ]; then
            echo "Zone illisible — purge ignorée (permission Zone:Read absente)."
            exit 0
          fi

          curl -sS -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" \
            | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          if d.get('success'):
              print('Cache purgé.')
          else:
              print('Purge refusée :')
              for e in d.get('errors', []):
                  print(f\"  [{e.get('code')}] {e.get('message')}\")
              print('  -> permission Cache Purge absente du token.')
          "

      # Le contrôle précédent porte sur le HTML construit ici ; celui-ci porte
      # sur le site réellement servi, où l'hébergeur peut avoir modifié la
      # réponse (bloc ajouté au robots.txt, réécriture des liens mailto:).
      - name: Vérifier le site en ligne
        run: npm run smoke -- https://talentcaresante.fr

      # Prévient Bing, Yandex et les autres moteurs participants qu'une page a
      # changé. Uniquement les pages du jour : renvoyer tout le site à chaque
      # déploiement noierait le signal. Google n'utilise pas IndexNow — pour lui
      # c'est le sitemap et Search Console qui comptent.
      #
      # Après la vérification en ligne : le fichier de clé doit déjà être servi.
      # Échec toléré, un refus de soumission ne doit pas invalider un
      # déploiement par ailleurs correct.
      - name: Signaler les nouveautés à IndexNow
        continue-on-error: true
        run: npm run indexnow
