name: Déploiement

# Le build part toujours du dépôt cloné par la CI, jamais d'un dossier local :
# c'est ce qui rend structurellement impossible qu'une page existe en
# production sans être versionnée.
on:
  push:
    branches: [main]
  # Reconstruction quotidienne : c'est elle qui fait sortir les articles datés
  # dans le futur, le jour venu, sans intervention.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# Un seul déploiement à la fois : deux builds concurrents publieraient dans un
# ordre imprévisible.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nom du projet Cloudflare Pages. Créé au premier déploiement s'il n'existe pas.
  PROJECT_NAME: talentcaresante

jobs:
  deploy:
    name: Construire et publier
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la configuration
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=""
          [ -n "$ACCOUNT_ID" ] || missing="$missing\n  - secret CLOUDFLARE_ACCOUNT_ID"
          [ -n "$API_TOKEN" ]  || missing="$missing\n  - secret CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            printf 'Configuration incomplète :%b\n' "$missing"
            exit 1
          fi

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      # Bloquant : un lien interne mort, un title manquant ou un composant non
      # rendu arrête le déploiement au lieu d'atteindre les visiteurs.
      - name: Contrôles SEO
        run: npm run seo:check

      # `pages deploy` échoue si le projet n'existe pas ; on le crée au premier
      # passage. La commande est jouée après le build pour ne rien créer si la
      # construction échoue, et son échec est ignoré lorsque le projet est déjà là.
      - name: Créer le projet Pages si nécessaire
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages project create ${{ env.PROJECT_NAME }}
            --production-branch=main

      - name: Publier sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=${{ env.PROJECT_NAME }}
            --branch=main
            --commit-dirty=true

      # Le contrôle précédent porte sur le HTML construit ici ; celui-ci porte
      # sur le site réellement servi, où l'hébergeur peut avoir modifié la
      # réponse (bloc ajouté au robots.txt, réécriture des liens mailto:).
      - name: Vérifier le site en ligne
        run: npm run smoke -- https://talentcaresante.fr
