<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 13 96 96" width="512" height="512">
  <defs>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6E7F2"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2E9E7E"/>
      <stop offset="1" stop-color="#6FC44A"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5BB733"/>
      <stop offset="1" stop-color="#8ED04F"/>
    </linearGradient>
  </defs>

  <!-- Feuilles, logées dans la boucle -->
  <path d="M55 72 C38 69 32 56 35 43 C49 46 56 58 55 72 Z" fill="url(#leafA)"/>
  <path d="M58 74 C58 53 68 40 83 36 C85 55 75 70 58 74 Z" fill="url(#leafB)"/>
  <path d="M55 72 C48 62 43 55 37 47" stroke="#fff" stroke-opacity=".5" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M58 74 C64 61 71 50 81 40" stroke="#fff" stroke-opacity=".45" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Tubulure : les deux branches descendent et se rejoignent en bas -->
  <path d="M26 26 C18 52 24 76 44 86 C58 93 72 88 79 78"
        stroke="url(#tube)" stroke-width="9.5" fill="none" stroke-linecap="round"/>
  <path d="M90 26 C97 46 96 62 90 72"
        stroke="url(#tube)" stroke-width="9.5" fill="none" stroke-linecap="round"/>

  <!-- Embouts auriculaires -->
  <circle cx="26" cy="24" r="6.8" fill="#FFFFFF"/>
  <circle cx="90" cy="24" r="6.8" fill="#FFFFFF"/>

  <!-- Pavillon, relié à la branche droite -->
  <circle cx="90" cy="88" r="15.5" fill="#FFFFFF"/>
  <circle cx="90" cy="88" r="11.2" fill="#fff"/>
  <circle cx="90" cy="88" r="8.2" fill="#22B59B"/>
</svg>
